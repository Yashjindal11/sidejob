name: Publish to PyPI

# Runs when a GitHub Release is published (tag must be v<version>, e.g. v0.1.0).
# Uses PyPI trusted publishing (OIDC): no API token is stored in this repository.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  tests:
    name: Run CI before publishing
    uses: ./.github/workflows/ci.yml

  build:
    name: Build distributions
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check the release tag matches the package version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          INIT_VERSION=$(python -c "import re; print(re.search(r'__version__ = \"(.+?)\"', open('src/sidejob/__init__.py').read()).group(1))")
          echo "tag=$TAG pyproject=$VERSION __init__=$INIT_VERSION"
          if [ "$TAG" != "v$VERSION" ] || [ "$VERSION" != "$INIT_VERSION" ]; then
            echo "::error::Release tag ($TAG), pyproject.toml ($VERSION) and sidejob.__version__ ($INIT_VERSION) must agree (tag = v<version>)."
            exit 1
          fi
      - run: python -m pip install --upgrade pip build twine
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - name: Smoke-test the built wheel
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install dist/*.whl
          /tmp/smoke/bin/python -c "import sidejob; m = sidejob.initialize(retry_backoff=0); j = m.parallel_job(lambda: 42); m.wait_all(); assert j.result() == 42; m.shutdown(); print('ok', sidejob.__version__)"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/sidejob/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
