[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "sidejob"
version = "0.2.0"
description = "Simple, observable, fail-loud background jobs for data analysts (threads, retries, mandatory wait_all barrier)."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [{ name = "Yash Jindal", email = "ykjindal4@gmail.com" }]
keywords = ["background jobs", "threads", "retry", "pandas", "pyspark", "databricks", "jupyter"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/Yashjindal11/sidejob"
Documentation = "https://github.com/Yashjindal11/sidejob#readme"
Source = "https://github.com/Yashjindal11/sidejob"
Issues = "https://github.com/Yashjindal11/sidejob/issues"
Changelog = "https://github.com/Yashjindal11/sidejob/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-timeout>=2", "ruff>=0.4", "mypy>=1.8"]

[tool.hatch.build.targets.wheel]
packages = ["src/sidejob"]

[tool.hatch.build.targets.sdist]
include = ["src/sidejob", "tests", "examples", "README.md", "LICENSE", "CHANGELOG.md", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = ["error"]
timeout = 60

[tool.ruff]
line-length = 100
target-version = "py39"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = [
    "UP006", "UP007", "UP035", "UP045",  # keep typing.Optional/List for py3.9 readability
    "RUF012",
    "SIM105",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011", "SIM117"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/sidejob"]
